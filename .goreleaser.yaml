# GoReleaser config for SteerMesh/axon.
#
# Produces two binaries per tagged release:
#
#   - mesh-axon:  the binary mesh's `mesh mates install axon` fallback path
#     (axonInstallFromGitHub in github.com/SteerMesh/mesh's
#     internal/ops/axon_install.go) downloads directly from this repo's
#     GitHub releases. That consumer constructs the asset name itself as
#     fmt.Sprintf("mesh-axon-%s-%s", runtime.GOOS, runtime.GOARCH) (plus
#     ".exe" on windows) and downloads exactly that name and
#     "<name>.sha256" via `gh release download --pattern`. The archive
#     name_template below must match that construction exactly -- it is
#     not cosmetic.
#
#     Built for darwin/amd64, darwin/arm64, linux/amd64, linux/arm64 only.
#     windows is deliberately NOT built: internal/target/command_unix.go
#     and shell.go (the PTY adapters newServeCommand() wires up
#     unconditionally for every target kind -- shell, SSH, Docker exec,
#     tmux) both carry a `//go:build unix` tag, so `cmd/mesh-axon` fails to
#     compile for GOOS=windows today (confirmed by actually attempting
#     this build: "undefined: target.NewCommandAdapter" etc.). Windows
#     support is partially started (cmd/mesh-axon/attach_windows.go stubs
#     attach as "not supported on Windows yet") but incomplete, and
#     finishing it is a platform-support feature, not release tooling --
#     out of scope here. mesh's axonDest()/axonInstallFromGitHub already
#     handle a hypothetical ".exe" asset name, so adding windows/amd64
#     here later (once cmd/mesh-axon actually builds for it) needs no
#     change on the mesh side, only adding "windows" back to this build's
#     goos list.
#
#   - axon-relay: pure networking/HTTP, no PTY dependency, builds cleanly
#     for all 5 platforms including windows/amd64. Not fetched by any
#     known automation today (the relay side is self-hosted infra, see
#     deploy/axon-relay/README.md); built and published as a convenience
#     for operators who'd rather download a binary than build from source
#     or a container.
#
# Per-asset ".sha256" sidecars (one file per binary, not one combined
# checksums.txt covering everything) are NOT produced by this config --
# GoReleaser's only built-in checksum mechanism (the `checksum:` block)
# produces a single combined file, and there is no OSS hook stage that
# runs after archives are named but before the release is published where
# per-file sidecars could be generated and attached as individually named
# extra_files. That combined checksums.txt is disabled below as redundant
# noise. The required per-asset sidecars are instead generated by a
# plain shell step in .github/workflows/release.yml, run against this
# run's dist/ directory right after this config's release step completes.
version: 2

builds:
  - id: mesh-axon
    main: ./cmd/mesh-axon
    binary: mesh-axon
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # Matches the Makefile's `LDFLAGS := -X main.version=$(VERSION)` exactly
    # -- see cmd/mesh-axon/main.go's `version` var doc comment for why the
    # variable name and the "mesh-axon <version>" output format matter.
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: axon-relay
    main: ./cmd/axon-relay
    binary: axon-relay
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

# format: binary publishes the raw compiled binary as the release asset
# (no tar.gz/zip wrapping), named by name_template alone. This is what
# makes the uploaded asset name exactly "mesh-axon-{{.Os}}-{{.Arch}}"
# (".exe" appended automatically on windows), matching mesh's consumer
# construction byte for byte.
archives:
  - id: mesh-axon-archive
    ids: [mesh-axon]
    formats: [binary]
    name_template: "mesh-axon-{{ .Os }}-{{ .Arch }}"

  - id: axon-relay-archive
    ids: [axon-relay]
    formats: [binary]
    name_template: "axon-relay-{{ .Os }}-{{ .Arch }}"

# The combined checksums.txt is redundant with (and would otherwise sit
# alongside, confusingly) the per-asset .sha256 sidecars that
# .github/workflows/release.yml generates after this runs, so it's
# disabled rather than published.
checksum:
  disable: true

release:
  # The workflow step that follows `goreleaser release` uploads the
  # per-asset .sha256 sidecars into this same release via
  # `gh release upload`, so GoReleaser itself never needs to know about
  # them.
  mode: keep-existing

changelog:
  disable: false
